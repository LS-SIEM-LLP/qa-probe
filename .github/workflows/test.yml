name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify all modules load
        run: node -e "
          require('./src/analyze/route-extractor');
          require('./src/analyze/graph-builder');
          require('./src/config/schema');
          require('./src/probe/endpoint-runner');
          require('./src/mcp/sanitize');
          require('./src/report/root-cause');
          console.log('all modules load OK');
        "
